<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1248" viewBox="0 0 1000 1248" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">GitHub CI와 수동 Azure 실행 및 발표 Workflow</title>
  <desc id="desc">GitHub Actions는 코드와 Bicep을 검사하지만 배포하지 않습니다. 운영자는 Azure 기반 환경과 네트워크를 준비하고 compute, assets, train, external, deploy, verify 순서로 실행합니다. 명령 실행 순서는 동일 모델의 lineage를 의미하지 않습니다. assets에는 Components 등록이 포함되고 deploy는 별도 HF 모델을 배포합니다. 발표에서는 완료된 Job과 Endpoint를 사용합니다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#32658b"/></marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;fill:#17324d;font-size:18px}
      .title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.small{font-size:16px;fill:#405b72}
      .box{fill:#fff;stroke:#8daec6;stroke-width:1.5}
      .edge{fill:none;stroke:#32658b;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#arrow)}
      .command{font-family:Consolas,"Courier New",monospace;font-size:20px;font-weight:700;fill:#075b93}
    </style>
  </defs>
  <rect width="1000" height="1248" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">개발 → Azure 실행 → 세션 시연 Workflow</text>
  <text x="32" y="76" class="small">CI 검증 / 운영자 수동 실행 / 준비된 결과 시연을 분리합니다.</text>

  <g class="panel" id="github-ci">
    <rect x="24" y="112" width="952" height="278" rx="14" fill="#f1f5fa" stroke="#b8c9da"/>
    <text x="44" y="146" class="heading">A / GitHub Actions CI</text>
    <g class="node" id="ci-trigger">
      <rect x="44" y="176" width="200" height="156" rx="10" class="box"/>
      <text x="60" y="210" class="heading">CI trigger</text>
      <text x="60" y="242">push / pull_request</text>
      <text x="60" y="274" class="small">workflow_dispatch</text>
    </g>
    <g class="node" id="ci-dependencies">
      <rect x="280" y="176" width="200" height="156" rx="10" class="box"/>
      <text x="296" y="210" class="heading">의존성 설치</text>
      <text x="296" y="242">uv sync --locked</text>
      <text x="296" y="274" class="small">--extra serving</text>
      <text x="296" y="308" class="small">Python 3.11</text>
    </g>
    <g class="node" id="ci-tests">
      <rect x="516" y="176" width="200" height="156" rx="10" class="box"/>
      <text x="532" y="210" class="heading">코드 / 테스트</text>
      <text x="532" y="242">Ruff check / format</text>
      <text x="532" y="274">pytest</text>
      <text x="532" y="308" class="small">실모델 테스트는 조건부</text>
    </g>
    <g class="node" id="ci-bicep">
      <rect x="752" y="176" width="204" height="156" rx="10" class="box"/>
      <text x="768" y="210" class="heading">Bicep 검증</text>
      <text x="768" y="242">az bicep build</text>
      <text x="768" y="274" class="small">배포·이미지 push 없음</text>
    </g>
    <path d="M244 254H280" class="edge"/>
    <path d="M480 254H516" class="edge"/>
    <path d="M716 254H752" class="edge"/>
    <text x="44" y="370">코드·템플릿 검증만 수행합니다. 클라우드 배포(CD)는 포함하지 않습니다.</text>
  </g>

  <g class="panel" id="manual-execution">
    <rect x="24" y="414" width="952" height="556" rx="14" fill="#eef6ff" stroke="#83a9ca"/>
    <text x="44" y="448" class="heading">B / 운영자 수동 실행: PowerShell + Azure CLI + SDK v2</text>
    <text x="44" y="482">사전 준비: az login → Bicep validate / what-if / 배포</text>
    <text x="44" y="512">RBAC → Managed Network provision (실제 설정과 IaC 차이 확인)</text>
    <g class="node" id="cli-command">
      <rect x="44" y="540" width="912" height="46" rx="8" fill="#fff" stroke="#b8c9da"/>
      <text x="60" y="570" class="command">uv run --no-sync python -m demo.manage &lt;action&gt;</text>
    </g>
    <text x="44" y="604" class="small">01 → 06은 CLI 실행 순서입니다. 동일 모델의 학습 → 배포 lineage를 의미하지 않습니다.</text>
    <g class="node" id="compute-action">
      <rect x="44" y="626" width="272" height="112" rx="10" class="box"/>
      <text x="60" y="660" class="command">01 compute</text>
      <text x="60" y="692">CPU cluster 준비</text>
      <text x="60" y="720" class="small">min 0 / max 2</text>
    </g>
    <g class="node" id="assets-action">
      <rect x="364" y="626" width="272" height="112" rx="10" class="box"/>
      <text x="380" y="660" class="command">02 assets</text>
      <text x="380" y="692">Data / 환경 등록</text>
      <text x="380" y="720" class="small">Components 등록 포함</text>
    </g>
    <g class="node" id="train-action">
      <rect x="684" y="626" width="272" height="112" rx="10" class="box"/>
      <text x="700" y="660" class="command">03 train</text>
      <text x="700" y="692">Pipeline 2개 실행</text>
      <text x="700" y="720" class="small">완료 후 MLflow 모델 등록</text>
    </g>
    <g class="node" id="external-action">
      <rect x="44" y="790" width="272" height="112" rx="10" class="box"/>
      <text x="60" y="824" class="command">04 external</text>
      <text x="60" y="856">PC CPU 학습 · AML MLflow</text>
      <text x="60" y="884" class="small">클라우드 학습 모델과 별도</text>
    </g>
    <g class="node" id="deploy-action">
      <rect x="364" y="790" width="272" height="112" rx="10" class="box"/>
      <text x="380" y="824" class="command">05 deploy</text>
      <text x="380" y="856">사전학습 HF 등록·배포</text>
      <text x="380" y="884" class="small">churn 학습 출력 사용 안 함</text>
    </g>
    <g class="node" id="verify-action">
      <rect x="684" y="790" width="272" height="112" rx="10" class="box"/>
      <text x="700" y="824" class="command">06 verify</text>
      <text x="700" y="856">상태 및 Endpoint 호출</text>
      <text x="700" y="884" class="small">HTTP 200 / 401 / 424</text>
    </g>
    <path d="M316 682H364" class="edge"/>
    <path d="M636 682H684" class="edge"/>
    <path id="continue-to-external" d="M820 738V764H180V790" class="edge"/>
    <path d="M316 846H364" class="edge"/>
    <path d="M636 846H684" class="edge"/>
    <text x="44" y="934" class="small">all = 위 6단계 순차 실행 · 실패 시 예외·종료 코드를 확인한 뒤 해당 단계의 원인을 수정</text>
    <text x="44" y="958" class="small">local/state.json: 단계 결과 · local/verification.json: 호출 결과 (모두 Git 제외)</text>
  </g>

  <g class="panel" id="presentation">
    <rect x="24" y="994" width="952" height="230" rx="14" fill="#eaf7f5" stroke="#76ada7"/>
    <text x="44" y="1028" class="heading">C / 발표 당일: 준비된 결과로 Studio 탐색</text>
    <g class="node" id="data-tab">
      <rect x="44" y="1056" width="168" height="72" rx="8" class="box"/>
      <text x="60" y="1086" class="heading">Data</text>
      <text x="60" y="1112" class="small">v1 / v2</text>
    </g>
    <g class="node" id="jobs-tab">
      <rect x="230" y="1056" width="168" height="72" rx="8" class="box"/>
      <text x="246" y="1086" class="heading">Jobs</text>
      <text x="246" y="1112" class="small">Experiments</text>
    </g>
    <g class="node" id="models-tab">
      <rect x="416" y="1056" width="168" height="72" rx="8" class="box"/>
      <text x="432" y="1086" class="heading">Models</text>
      <text x="432" y="1112" class="small">모델 버전</text>
    </g>
    <g class="node" id="environments-tab">
      <rect x="602" y="1056" width="168" height="72" rx="8" class="box"/>
      <text x="618" y="1086">Environments</text>
      <text x="618" y="1112" class="small">ACR 이미지</text>
    </g>
    <g class="node" id="endpoint-tab">
      <rect x="788" y="1056" width="168" height="72" rx="8" class="box"/>
      <text x="804" y="1086" class="heading">Endpoints</text>
      <text x="804" y="1112" class="small">Test / Consume</text>
    </g>
    <path d="M212 1092H230" class="edge"/>
    <path d="M398 1092H416" class="edge"/>
    <path d="M584 1092H602" class="edge"/>
    <path d="M770 1092H788" class="edge"/>
    <text x="44" y="1164">Completed Job과 영어 Endpoint 샘플을 사용하고, 한국어 품질 한계를 안내합니다.</text>
    <text x="44" y="1196" class="small">Studio 탭의 로그인 후 시각 검증은 별도로 필요합니다. 최초 이미지 빌드·VM 대기는 사전 실행하세요.</text>
  </g>
</svg>
