<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Azure ML의 권한 관리, 상태 모니터링, 비용 관리 기능</title>
  <desc id="desc">Entra ID와 RBAC, Managed Identity로 접근 권한을 관리하고, 요청 지표와 로그로 서비스 상태를 관측하며, Compute 자동 축소와 Cost Management로 사용량과 비용을 관리합니다. Public은 데모의 접근 방식이며 운영 요구에 따라 Private 구성이 가능합니다.</desc>
  <defs><style>text{font-family:"Segoe UI","Malgun Gothic",sans-serif;fill:#17324d;font-size:19px}.title{font-size:27px;font-weight:700}.heading{font-size:23px;font-weight:700}.small{font-size:17px;fill:#405b72}</style></defs>
  <rect width="1080" height="500" rx="16" fill="#fff"/>
  <text x="36" y="46" class="title">권한·서비스 상태·비용을 Azure ML 운영 기능으로 관리</text>
  <g class="node"><rect x="36" y="106" width="312" height="292" rx="12" fill="#eef6ff" stroke="#83a9ca"/><text x="60" y="149" class="heading">01 / 권한 관리</text><text x="60" y="198">Entra ID · RBAC</text><text x="60" y="236">사용자·팀별 역할</text><text x="60" y="274">Managed Identity</text><text x="60" y="322" class="small">학습·서빙의 identity</text><text x="60" y="354" class="small">비밀번호 없는 자원 접근</text><text x="60" y="382" class="small">자산·작업·배포 권한 구분</text></g>
  <g class="node"><rect x="384" y="106" width="312" height="292" rx="12" fill="#edf8f3" stroke="#89b9a2"/><text x="408" y="149" class="heading">02 / 상태 모니터링</text><text x="408" y="198">요청 수·지연·오류</text><text x="408" y="236">Application Insights</text><text x="408" y="274">Log Analytics</text><text x="408" y="322" class="small">요청 지표·컨테이너 로그</text><text x="408" y="354" class="small">실행·모델 버전 추적</text><text x="408" y="382" class="small">Azure Monitor 알림 연계</text></g>
  <g class="node"><rect x="732" y="106" width="312" height="292" rx="12" fill="#fff4e8" stroke="#d2af80"/><text x="756" y="149" class="heading">03 / 비용 관리</text><text x="756" y="198">Compute 자동 축소</text><text x="756" y="236">팀·프로젝트별 사용량</text><text x="756" y="274">Cost Management</text><text x="756" y="322" class="small">RG·태그별 비용 분석</text><text x="756" y="354" class="small">예산·알림 설정 가능</text><text x="756" y="382" class="small">상시 서빙 비용 별도 관리</text></g>
  <text x="36" y="444">Public은 데모의 접근 방식 · 운영 요구에 따라 Private 구성 가능</text>
  <text x="36" y="478" class="small">동일한 MLOps 기능에 기업의 권한·감사·네트워크 정책을 적용합니다.</text>
</svg>
