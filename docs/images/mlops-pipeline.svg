<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1172" viewBox="0 0 1000 1172" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">학습 및 HF 서빙의 별도 MLOps 경로</title>
  <desc id="desc">클라우드 학습은 합성 Data v1을 Prepare와 Train에 전달해 Logistic과 Random Forest를 같은 holdout으로 비교합니다. 두 Pipeline Job이 완료된 후 SDK로 모델을 등록합니다. 외부 PC 학습은 Data v2를 사용합니다. HF 서빙은 별도 사전학습 MiniLM과 ACR 환경 이미지를 사용하는 독립 경로이며 churn 학습 모델을 배포하지 않습니다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#32658b"/></marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;fill:#17324d;font-size:18px}
      .title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.small{font-size:16px;fill:#405b72}
      .box{fill:#fff;stroke:#8daec6;stroke-width:1.5}
      .edge{fill:none;stroke:#32658b;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="1172" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">MLOps Pipeline / 모델 lineage</text>
  <text x="32" y="76" class="small">클라우드 학습 · 외부 CPU 추적 · 사전학습 HF 서빙을 분리한 교육 시나리오</text>

  <g class="panel" id="cloud-training">
    <rect x="24" y="112" width="952" height="430" rx="14" fill="#eef6ff" stroke="#83a9ca"/>
    <text x="44" y="146" class="heading">01 / 클라우드 학습: telco churn</text>
    <g class="panel" id="pipeline-graph">
      <rect x="264" y="164" width="468" height="240" rx="10" fill="#dfedfc" stroke="#6597c0" stroke-dasharray="6 4"/>
      <text x="280" y="188" class="small">AML Pipeline graph · 알고리즘별 1개, 총 2개 Job</text>
      <g class="node" id="prepare">
        <rect x="280" y="204" width="200" height="186" rx="10" class="box"/>
        <text x="296" y="238" class="heading">Prepare</text>
        <text x="296" y="270">75 / 25</text>
        <text x="296" y="298">층화 분할</text>
        <text x="296" y="338" class="small">train 1,125</text>
        <text x="296" y="368" class="small">holdout 375</text>
      </g>
      <g class="node" id="train">
        <rect x="516" y="204" width="200" height="186" rx="10" class="box"/>
        <text x="532" y="238" class="heading">Train</text>
        <text x="532" y="270">Logistic /</text>
        <text x="532" y="298">Random Forest</text>
        <text x="532" y="338" class="small">MLflow model 출력</text>
        <text x="532" y="368" class="small">같은 v1 holdout</text>
      </g>
    </g>
    <g class="node" id="data-assets">
      <rect x="44" y="204" width="200" height="186" rx="10" class="box"/>
      <text x="60" y="238" class="heading">Data assets</text>
      <text x="60" y="270">v1 / v2</text>
      <text x="60" y="298">CSV + MLTable</text>
      <text x="60" y="338" class="small">비교 실험: Data v1</text>
      <text x="60" y="368" class="small">v1: 1,500행</text>
    </g>
    <g class="node" id="model-registration">
      <rect x="752" y="204" width="204" height="186" rx="10" class="box"/>
      <text x="768" y="238" class="heading">모델 등록 (SDK)</text>
      <text x="768" y="270">Job Completed 확인</text>
      <text x="768" y="298" class="small">telco-churn-classifier</text>
      <text x="768" y="338" class="small">v1: Logistic</text>
      <text x="768" y="368" class="small">v2: Forest</text>
    </g>
    <path id="data-to-prepare" d="M244 288H280" class="edge"/>
    <path id="prepare-to-train" d="M480 288H516" class="edge"/>
    <path id="train-to-registration" d="M716 288H752" class="edge"/>
    <g class="node" id="mlflow-evidence">
      <rect x="44" y="420" width="912" height="88" rx="8" fill="#fff" stroke="#b8c9da"/>
      <text x="60" y="448">MLflow: params · accuracy / F1 / ROC AUC · confusion matrix · signature · input example</text>
      <text x="60" y="482" class="small">학습 run: Logistic 약 34초 / Forest 약 116초 (이미지 빌드·VM 대기 제외)</text>
    </g>
    <text x="44" y="530" class="small">등록은 Pipeline graph 밖에서 수행합니다. 자동 최적 모델 선택·배포는 포함하지 않습니다.</text>
  </g>

  <g class="panel" id="external-training">
    <rect x="24" y="564" width="952" height="188" rx="14" fill="#f4f2fb" stroke="#aea2ce"/>
    <text x="44" y="598" class="heading">02 / 외부 CPU 학습</text>
    <g class="node" id="external-data">
      <rect x="44" y="620" width="260" height="84" rx="10" class="box"/>
      <text x="60" y="650" class="heading">합성 Data v2</text>
      <text x="60" y="682">1,800행 · 별도 holdout</text>
    </g>
    <g class="node" id="external-compute">
      <rect x="370" y="620" width="260" height="84" rx="10" class="box"/>
      <text x="386" y="650" class="heading">PC CPU 학습</text>
      <text x="386" y="682">Logistic · AML Compute 아님</text>
    </g>
    <g class="node" id="external-registration">
      <rect x="696" y="620" width="260" height="84" rx="10" class="box"/>
      <text x="712" y="650" class="heading">AML MLflow 추적</text>
      <text x="712" y="682">telco-churn-external 등록</text>
    </g>
    <path d="M304 662H370" class="edge"/>
    <path d="M630 662H696" class="edge"/>
    <text x="44" y="734" class="small">Data v1 실험과 평가 데이터가 달라 성능 순위를 직접 비교하지 않습니다.</text>
  </g>

  <g class="panel" id="hf-serving">
    <rect x="24" y="776" width="952" height="282" rx="14" fill="#eaf7f5" stroke="#76ada7"/>
    <text x="44" y="810" class="heading">03 / 독립된 HF 서빙 경로</text>
    <text x="44" y="838" class="small">churn 학습 출력과 연결되지 않는 별도 사전학습 모델입니다.</text>
    <g class="node" id="hf-model">
      <rect x="44" y="860" width="200" height="168" rx="10" class="box"/>
      <text x="60" y="894" class="heading">HF MiniLM</text>
      <text x="60" y="926">revision 고정</text>
      <text x="60" y="956">Custom model:1</text>
      <text x="60" y="1002" class="small">추가 학습 없음</text>
    </g>
    <g class="node" id="serving-package">
      <rect x="280" y="860" width="200" height="168" rx="10" class="box"/>
      <text x="296" y="894" class="heading">서빙 패키지</text>
      <text x="296" y="926">모델 + score.py</text>
      <text x="296" y="956">kt-hf-cpu:1</text>
      <text x="296" y="1002" class="small">ACR 환경 이미지</text>
    </g>
    <g class="node" id="serving-endpoint">
      <rect x="516" y="860" width="200" height="168" rx="10" class="box"/>
      <text x="532" y="894" class="heading">CPU Endpoint</text>
      <text x="532" y="926">blue · DS2_v2 1대</text>
      <text x="532" y="956">Entra token 인증</text>
      <text x="532" y="1002" class="small">영어 임베딩 / cosine</text>
    </g>
    <g class="node" id="endpoint-verification">
      <rect x="752" y="860" width="204" height="168" rx="10" class="box"/>
      <text x="768" y="894" class="heading">호출 검증</text>
      <text x="768" y="926">200 / 무인증 401</text>
      <text x="768" y="956">입력 오류: 424</text>
      <text x="768" y="1002" class="small">모델 오류 코드: 400</text>
    </g>
    <path d="M244 944H280" class="edge"/>
    <path d="M480 944H516" class="edge"/>
    <path d="M716 944H752" class="edge"/>
  </g>
  <text x="32" y="1094" class="small">영어 모델이며 한국어 오분류를 확인했습니다. 생성형 LLM / continual fine-tuning이 아닙니다.</text>
  <text x="32" y="1120" class="small">미구현: churn 모델 서빙 · 자동 승인/승격 · 롤백 · drift 재학습</text>
  <text x="32" y="1146" class="small">분류: billing / network / cancellation · 임계값과 기타 범주 없음 · 상세: deployment-status 문서</text>
</svg>
