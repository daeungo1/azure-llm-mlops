<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">학습 및 HF 서빙의 별도 MLOps 경로</title>
  <desc id="desc">Data v1의 동일 holdout으로 두 개의 Prepare Train 파이프라인을 실행하고 MLflow 모델을 SDK로 등록합니다. 외부 학습은 Data v2를 사용합니다. HF MiniLM은 별도 사전학습 모델을 등록하여 ACR 환경 이미지와 함께 CPU Endpoint로 배포합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#32658b"/></marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic",sans-serif;fill:#17324d;font-size:16px}
      .title{font-size:28px;font-weight:700}.heading{font-size:19px;font-weight:700}.small{font-size:14px;fill:#405b72}
      .box{fill:#fff;stroke:#8daec6;stroke-width:1.5}.edge{fill:none;stroke:#32658b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="850" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">MLOps Pipeline / 모델 lineage</text>
  <text x="32" y="74" class="small">짧은 CPU 학습과 사전학습 HF 서빙을 분리한 교육 시나리오 | 자동 승격·CD 파이프라인 아님</text>
  <rect x="28" y="100" width="1144" height="302" rx="14" fill="#eef6ff" stroke="#83a9ca"/>
  <text x="48" y="133" class="heading">01 / 클라우드 학습: telco churn</text>
  <rect x="48" y="158" width="220" height="140" rx="10" class="box"/>
  <text x="64" y="188" class="heading">Data assets v1 / v2</text>
  <text x="64" y="217">합성 CSV + MLTable</text>
  <text x="64" y="246">학습 비교에는 v1 사용</text>
  <text x="64" y="277" class="small">1,500행 / 고객 데이터 없음</text>
  <rect x="304" y="148" width="540" height="164" rx="10" fill="#dfedfc" stroke="#6597c0" stroke-dasharray="6 4"/>
  <text x="322" y="177" class="small">AML Pipeline graph · 알고리즘별 1개 Job, 총 2개</text>
  <rect x="322" y="194" width="200" height="96" rx="8" class="box"/>
  <text x="338" y="222" class="heading">Prepare</text>
  <text x="338" y="250">75 / 25 층화 분할</text>
  <text x="338" y="276" class="small">train 1,125 / holdout 375</text>
  <rect x="562" y="194" width="264" height="96" rx="8" class="box"/>
  <text x="578" y="222" class="heading">Train + MLflow output</text>
  <text x="578" y="250">Logistic / Random Forest</text>
  <text x="578" y="276" class="small">동일 holdout · CPU · 환경 v2</text>
  <path d="M268 238H322" class="edge"/>
  <path d="M522 242H562" class="edge"/>
  <path d="M844 238H884" class="edge"/>
  <rect x="884" y="158" width="268" height="140" rx="10" class="box"/>
  <text x="902" y="188" class="heading">모델 등록 (SDK)</text>
  <text x="902" y="217">Job Completed 확인 후</text>
  <text x="902" y="246">telco-churn-classifier</text>
  <text x="902" y="277" class="small">v1: Logistic / v2: Forest</text>
  <text x="48" y="340">MLflow 추적: params · accuracy / F1 / ROC AUC · confusion matrix · signature · input example</text>
  <text x="48" y="376" class="small">학습 run 소요: Logistic 약 34초 / Forest 약 116초 (이미지 빌드·VM 대기 제외) | 자동 최적 모델 선택 없음</text>
  <rect x="28" y="420" width="1144" height="102" rx="12" fill="#f4f2fb" stroke="#aea2ce"/>
  <text x="48" y="453" class="heading">02 / 외부 CPU 학습</text>
  <text x="48" y="486">합성 Data v2 → PC의 Logistic 학습 → AML MLflow tracking → telco-churn-external 등록</text>
  <text x="48" y="509" class="small">데이터가 다르므로 클라우드 Data v1 실험과 성능 순위를 직접 비교하지 않음</text>
  <rect x="28" y="540" width="1144" height="214" rx="14" fill="#eaf7f5" stroke="#76ada7"/>
  <text x="48" y="573" class="heading">03 / 독립된 HF 서빙 경로 (churn 학습 출력과 연결되지 않음)</text>
  <rect x="48" y="599" width="236" height="127" rx="10" class="box"/>
  <text x="64" y="629" class="heading">HF MiniLM</text>
  <text x="64" y="658">고정 revision 다운로드</text>
  <text x="64" y="687">Custom model v1 등록</text>
  <text x="64" y="713" class="small">사전학습 모델 / 추가 학습 없음</text>
  <rect x="324" y="599" width="236" height="127" rx="10" class="box"/>
  <text x="340" y="629" class="heading">서빙 패키지</text>
  <text x="340" y="658">등록 모델 + score.py</text>
  <text x="340" y="687">kt-hf-cpu:1 환경</text>
  <text x="340" y="713" class="small">ACR Custom 이미지 사용</text>
  <rect x="600" y="599" width="236" height="127" rx="10" class="box"/>
  <text x="616" y="629" class="heading">CPU Endpoint</text>
  <text x="616" y="658">blue / DS2_v2 1대</text>
  <text x="616" y="687">Entra token 인증</text>
  <text x="616" y="713" class="small">영어 임베딩 / cosine 분류</text>
  <rect x="876" y="599" width="276" height="127" rx="10" class="box"/>
  <text x="892" y="629" class="heading">실제 호출 검증</text>
  <text x="892" y="658">정상 200 / 무인증 401</text>
  <text x="892" y="687">잘못된 입력 424 (모델 400)</text>
  <text x="892" y="713" class="small">billing / network / cancellation</text>
  <path d="M284 662H324" class="edge"/>
  <path d="M560 662H600" class="edge"/>
  <path d="M836 662H876" class="edge"/>
  <text x="32" y="791" class="small">품질 한계: 영어 모델이며 한국어 오분류 확인. 신뢰도 임계값·기타 범주 없음. 생성형 LLM / continual fine-tuning 아님.</text>
  <text x="32" y="821" class="small">미구현: churn 모델 서빙 · 자동 승인/승격 · 롤백 · drift 기반 재학습 | 상세 증적: docs/deployment-status.md</text>
</svg>
