<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Registry의 공유 자산과 Workspace의 실행 리소스</title>
  <desc id="desc">Azure ML Registry는 Model, Environment, Component, Data 자산을 공유합니다. Workspace는 Compute, Job, Experiment, Endpoint와 실행 이력을 관리합니다. 이 데모는 Model, Environment, Component의 공유 소비를 검증했습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="#32658b"/></marker>
    <style>text{font-family:"Segoe UI","Malgun Gothic",sans-serif;fill:#17324d;font-size:18px}.title{font-size:27px;font-weight:700}.heading{font-size:21px;font-weight:700}.small{font-size:16px;fill:#405b72}</style>
  </defs>
  <rect width="1080" height="500" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">Registry로 공유 = Model · Environment · Component · Data</text>
  <rect x="32" y="86" width="582" height="344" rx="12" fill="#eef6ff" stroke="#83a9ca"/>
  <text x="54" y="124" class="heading">Registry / 여러 Workspace가 참조하는 자산</text>
  <g class="node"><rect x="54" y="150" width="252" height="112" rx="10" fill="#fff" stroke="#83a9ca"/><text x="74" y="190" class="heading">Model</text><text x="74" y="230">이름 · 버전 · 모델 패키지</text></g>
  <g class="node"><rect x="332" y="150" width="258" height="112" rx="10" fill="#fff" stroke="#83a9ca"/><text x="352" y="190" class="heading">Environment</text><text x="352" y="230">실행 환경 · 이미지 · 의존성</text></g>
  <g class="node"><rect x="54" y="288" width="252" height="112" rx="10" fill="#fff" stroke="#83a9ca"/><text x="74" y="328" class="heading">Component</text><text x="74" y="368">입출력 · 코드 · 환경 · 명령</text></g>
  <g class="node"><rect x="332" y="288" width="258" height="112" rx="10" fill="#fff" stroke="#83a9ca"/><text x="352" y="328" class="heading">Data</text><text x="352" y="368">데이터 경로 · 읽기 규칙 · 버전</text></g>
  <path d="M614 258H672" fill="none" stroke="#32658b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624" y="243" class="small">참조</text>
  <g class="node"><rect x="672" y="86" width="376" height="344" rx="12" fill="#edf8f3" stroke="#89b9a2"/><text x="694" y="124" class="heading">Workspace / 실행·운영</text><text x="694" y="185">Compute · Job · Pipeline</text><text x="694" y="235">Experiment · Run · 실행 이력</text><text x="694" y="285">Endpoint · Deployment</text><text x="694" y="350" class="small">팀별 데이터 접근·네트워크·비용 경계</text><text x="694" y="388" class="small">Registry 접근 ≠ 상대 Storage 접근</text></g>
  <text x="32" y="474" class="small">현재 데모의 공유·소비 검증 대상은 Model · Environment · Component입니다.</text>
</svg>
