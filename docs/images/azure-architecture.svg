<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">KT Azure ML 데모 배포 아키텍처</title>
  <desc id="desc">발표 PC는 Entra 인증으로 public Azure ML Workspace와 HF Endpoint를 사용하며, 허용된 공인 IP에서 Storage에 접근합니다. Managed Network의 CPU 학습과 HF 서빙은 별도 모델 경로입니다. Storage와 Key Vault는 Private Endpoint를, ACR은 인증된 public 이미지 경로를 사용합니다. Endpoint 관측은 Application Insights와 Log Analytics에 연결됩니다. 리소스 관계 개념도이며 subnet 배치도가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#32658b"/></marker>
    <marker id="private-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#087e76"/></marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;fill:#17324d;font-size:18px}
      .title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.small{font-size:16px;fill:#405b72}
      .box{fill:#fff;stroke:#8daec6;stroke-width:1.5}
      .edge{fill:none;stroke:#32658b;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#arrow)}
      .private{fill:none;stroke:#087e76;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#private-arrow)}
    </style>
  </defs>
  <rect width="1000" height="1130" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">Azure ML 배포 아키텍처</text>
  <text x="32" y="76" class="small">rg-kt-mlops · Korea Central · public ingress + Entra ID + 보호된 의존 리소스</text>

  <g class="node" id="presenter">
    <rect x="44" y="116" width="236" height="156" rx="12" fill="#f1f5fa" stroke="#b8c9da"/>
    <text x="64" y="150" class="heading">개발 / 발표 PC</text>
    <text x="64" y="182">Studio · Azure Portal</text>
    <text x="64" y="212">CLI · SDK v2 · MLflow</text>
    <text x="64" y="246" class="small">GitHub: 코드 · 문서 · CI</text>
  </g>
  <g class="node" id="workspace">
    <rect x="340" y="116" width="616" height="156" rx="12" class="box"/>
    <text x="360" y="150" class="heading">Azure ML Workspace / Studio</text>
    <text x="360" y="182">mlw-ktmlops-secure · public access: Enabled</text>
    <text x="360" y="212">Data · Components · Environments · Jobs / MLflow · Models</text>
    <text x="360" y="246" class="small">제어 평면: 자산 관리 · Job 제출 · 모델 등록 · Endpoint 배포</text>
  </g>
  <path id="workspace-control" d="M280 194H340" class="edge"/>
  <text x="310" y="174" text-anchor="middle" class="small">Entra</text>
  <path id="endpoint-invoke" d="M162 272V306H780V392" class="edge"/>
  <text x="348" y="296" class="small">Endpoint 호출: HTTPS + aad_token</text>

  <g class="panel" id="managed-network">
    <rect x="24" y="328" width="952" height="280" rx="14" fill="#eaf7f5" stroke="#087e76" stroke-dasharray="7 5"/>
    <text x="44" y="362" class="heading">AML Managed Network: AllowInternetOutbound</text>
    <text x="44" y="584" class="small">학습과 HF 서빙은 별도 모델 lineage · 추론 시 HF 다운로드 없음 · 인터넷 완전 차단 아님</text>
    <g class="node" id="training-compute">
      <rect x="44" y="392" width="350" height="152" rx="10" class="box"/>
      <text x="64" y="426" class="heading">CPU cluster / cpu-secure</text>
      <text x="64" y="456">DS3_v2 · min 0 / max 2</text>
      <text x="64" y="486">Prepare → Train · 환경 이미지 빌드</text>
      <text x="64" y="520" class="small">학습 모델: telco-churn-classifier</text>
    </g>
    <g class="node" id="online-endpoint">
      <rect x="606" y="392" width="350" height="152" rx="10" class="box"/>
      <text x="626" y="426" class="heading">HF CPU Endpoint</text>
      <text x="626" y="456">kt-hf-cpu-secure / blue</text>
      <text x="626" y="486">DS2_v2 1대 · traffic 100%</text>
      <text x="626" y="520" class="small">MiniLM · 영어 intent 분류 · 무인증 401</text>
    </g>
  </g>

  <path id="storage-private" d="M188 608V694" class="private"/>
  <path id="vault-private" d="M500 608V694" class="private"/>
  <path id="acr-images" d="M688 694V608" class="edge" marker-start="url(#arrow)"/>
  <text x="206" y="660" class="small">Private Endpoint</text>
  <text x="518" y="660" class="small">Private Endpoint</text>
  <text x="708" y="660" class="small">인증된 이미지 push / pull</text>
  <g class="node" id="storage">
    <rect x="44" y="694" width="288" height="160" rx="10" class="box"/>
    <text x="64" y="728" class="heading">Storage / NSP Enforced</text>
    <text x="64" y="758">SecuredByPerimeter</text>
    <text x="64" y="788">PC: Entra + 허용된 IP /32</text>
    <text x="64" y="826" class="small">공유 키·익명 Blob 접근 차단</text>
  </g>
  <g class="node" id="key-vault">
    <rect x="356" y="694" width="288" height="160" rx="10" class="box"/>
    <text x="376" y="728" class="heading">Key Vault / RBAC</text>
    <text x="376" y="758">Private Endpoint</text>
    <text x="376" y="788">public access: Disabled</text>
    <text x="376" y="826" class="small">현재 배포된 실제 설정</text>
  </g>
  <g class="node" id="acr">
    <rect x="668" y="694" width="288" height="160" rx="10" class="box"/>
    <text x="688" y="728" class="heading">ACR Premium</text>
    <text x="688" y="758">Custom 이미지 · public + RBAC</text>
    <text x="688" y="788">PE 없음 · push / pull</text>
    <text x="688" y="816" class="small">admin / anonymous pull:</text>
    <text x="688" y="838" class="small">Disabled</text>
  </g>
  <path id="presenter-storage" d="M44 230H12V774H44" class="edge"/>
  <path id="endpoint-telemetry" d="M956 468H988V964H976" class="edge"/>

  <g class="panel" id="observability">
    <rect x="24" y="896" width="952" height="144" rx="12" fill="#fff7e8" stroke="#d4ae64"/>
    <text x="44" y="930" class="heading">관측 / 검증: Application Insights + Log Analytics</text>
    <text x="44" y="964">Endpoint metrics / logs 수집</text>
    <text x="44" y="1008" class="small">관측 리소스 구성·수집 확인은 운영 SLO / HA 검증을 의미하지 않습니다.</text>
  </g>
  <path d="M32 1076H68" class="edge"/>
  <text x="80" y="1082" class="small">실선: 제어 / 호출 / 이미지 / 관측</text>
  <path d="M480 1076H516" class="private"/>
  <text x="528" y="1082" class="small">점선: Private Endpoint 의존 경로</text>
  <text x="32" y="1110" class="small">리소스 관계 개념도입니다. Key Vault 실제 설정과 IaC 차이는 deployment-status 문서 참조.</text>
</svg>
