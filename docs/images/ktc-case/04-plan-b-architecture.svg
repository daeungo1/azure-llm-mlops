  <!-- right -->
  <rect x="750" y="64" width="230" height="116" rx="8" class="s-box" />
  <text x="865" y="92" text-anchor="middle" class="s-t">Git 저장소 projNN</text>
  <text x="865" y="118" text-anchor="middle" class="s-b">코드 + .dvc 포인터</text>
  <text x="865" y="140" text-anchor="middle" class="s-q">데이터 버전 = 커밋</text>
  <rect x="750" y="204" width="230" height="116" rx="8" class="s-box" />
