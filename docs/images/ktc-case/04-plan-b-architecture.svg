<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc" width="1000" height="540" style="max-width:100%;height:auto"><title id="title">Plan B: 과제별 MLflow 인스턴스와 DVC, 실물은 과제 Blob</title><desc id="desc">원문 설계안의 그림 4. MLflow는 과제별 인스턴스로 분리하고, 서버가 과제 UAMI로 Blob에 Artifact를 씁니다. 클라이언트에는 Blob 권한이 필요 없습니다. 실제 데모 배포 검증 결과가 아닙니다. GPU 규모와 내부 서빙 이름은 일반화했습니다.</desc><style><![CDATA[:root{
  --bg:#f7f7f5; --paper:#ffffff; --ink:#1b1d21; --quiet:#5b616b; --line:#d9dbe0; --soft:#eef0f3;
  --accent:#2563eb; --accent-soft:#e8efff; --accent2:#0f766e; --accent2-soft:#e3f4f1; --warn:#b45309; --warn-soft:#fdf3e4;
  --box:#ffffff; --box-stroke:#8a909a; --conn:#7a808a;
}
svg{background:var(--paper)}

svg text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
.s-box{fill:var(--box);stroke:var(--box-stroke);stroke-width:1.25}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-acc2{fill:var(--accent2-soft);stroke:var(--accent2);stroke-width:2}
.s-grp{fill:none;stroke:var(--box-stroke);stroke-width:1.1;stroke-dasharray:6 5}
.s-grp2{fill:var(--soft);stroke:none}
.s-ln{fill:none;stroke:var(--conn);stroke-width:1.4}
.s-ln2{fill:none;stroke:var(--accent2);stroke-width:1.6}
.s-t{fill:var(--ink);font-size:14px;font-weight:700}
.s-b{fill:var(--ink);font-size:12.5px}
.s-q{fill:var(--quiet);font-size:12px}
.s-g{fill:var(--quiet);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.s-arw{fill:var(--conn)}
.s-arw2{fill:var(--accent2)}
.s-card{fill:var(--paper);stroke:var(--box-stroke);stroke-width:1.2;stroke-dasharray:5 4}
.s-chip{fill:var(--box);stroke:var(--line);stroke-width:1}
.s-x{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.4}
.s-xt{fill:var(--warn);font-size:12px;font-weight:700}
.s-h{fill:var(--ink);font-size:15px;font-weight:800}
.s-s{fill:var(--quiet);font-size:11px}
.s-c{fill:var(--ink);font-size:11.5px}
]]></style><rect width="100%" height="100%" fill="var(--paper)" />
