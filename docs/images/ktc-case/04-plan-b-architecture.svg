  <text x="865" y="280" text-anchor="middle" class="s-q">Blob에서 pull</text>
  <rect x="750" y="356" width="230" height="164" rx="8" class="s-grp" />
  <text x="865" y="386" text-anchor="middle" class="s-t">관리형 대안</text>
  <text x="865" y="414" text-anchor="middle" class="s-b">Plan C: Azure Databricks</text>
  <text x="865" y="436" text-anchor="middle" class="s-b">(관리형 MLflow + UC)</text>
  <text x="865" y="464" text-anchor="middle" class="s-q">외부 SaaS(W&amp;B 등)는</text>
  <text x="865" y="484" text-anchor="middle" class="s-q">데이터 반출 검토 필요</text>
