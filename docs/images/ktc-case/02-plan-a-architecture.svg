<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" width="1000" height="520" style="max-width:100%;height:auto"><title id="title">Plan A: Slurm 학습은 그대로, 형상만 과제별 AML Workspace</title><desc id="desc">Slurm 학습의 지표 추적과 Data Mover의 파일 이동·모델 버전 등록을 분리하는 Azure ML 설계입니다.</desc><style><![CDATA[:root{
  --bg:#f7f7f5; --paper:#ffffff; --ink:#1b1d21; --quiet:#5b616b; --line:#d9dbe0; --soft:#eef0f3;
  --accent:#2563eb; --accent-soft:#e8efff; --accent2:#0f766e; --accent2-soft:#e3f4f1; --warn:#b45309; --warn-soft:#fdf3e4;
  --box:#ffffff; --box-stroke:#8a909a; --conn:#7a808a;
}
svg{background:var(--paper)}

svg text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
.s-box{fill:var(--box);stroke:var(--box-stroke);stroke-width:1.25}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-acc2{fill:var(--accent2-soft);stroke:var(--accent2);stroke-width:2}
.s-grp{fill:none;stroke:var(--box-stroke);stroke-width:1.1;stroke-dasharray:6 5}
.s-grp2{fill:var(--soft);stroke:none}
.s-ln{fill:none;stroke:var(--conn);stroke-width:1.4}
.s-ln2{fill:none;stroke:var(--accent2);stroke-width:1.6}
.s-t{fill:var(--ink);font-size:14px;font-weight:700}
.s-b{fill:var(--ink);font-size:12.5px}
.s-q{fill:var(--quiet);font-size:12px}
.s-g{fill:var(--quiet);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.s-arw{fill:var(--conn)}
.s-arw2{fill:var(--accent2)}
.s-card{fill:var(--paper);stroke:var(--box-stroke);stroke-width:1.2;stroke-dasharray:5 4}
.s-chip{fill:var(--box);stroke:var(--line);stroke-width:1}
.s-x{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.4}
.s-xt{fill:var(--warn);font-size:12px;font-weight:700}
.s-h{fill:var(--ink);font-size:15px;font-weight:800}
.s-s{fill:var(--quiet);font-size:11px}
.s-c{fill:var(--ink);font-size:11.5px}
]]></style><rect width="100%" height="100%" fill="var(--paper)" />
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="s-arw" /></marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="s-arw2" /></marker>
  </defs>
  <!-- cluster -->
  <rect x="20" y="20" width="280" height="480" rx="12" class="s-grp2" />
  <text x="36" y="44" class="s-g">CycleCloud 클러스터 (공통)</text>
  <rect x="40" y="64" width="240" height="116" rx="8" class="s-box" />
  <text x="160" y="92" text-anchor="middle" class="s-t">학습 job (GPU)</text>
  <text x="160" y="118" text-anchor="middle" class="s-b">rank 0만 MLflow 로깅</text>
  <text x="160" y="140" text-anchor="middle" class="s-q">azureml-mlflow</text>
  <text x="160" y="160" text-anchor="middle" class="s-q">과제 SP 인증서(그룹 권한)</text>
  <rect x="40" y="204" width="240" height="116" rx="8" class="s-acc2" />
  <text x="160" y="232" text-anchor="middle" class="s-t">stage-out job (dm-projNN)</text>
  <text x="160" y="258" text-anchor="middle" class="s-b">Checkpoint · 모델 → Blob</text>
  <text x="160" y="280" text-anchor="middle" class="s-q">Model · Data 버전 등록</text>
  <text x="160" y="300" text-anchor="middle" class="s-q">sha256 · URI Tag</text>
  <rect x="40" y="344" width="240" height="96" rx="8" class="s-box" />
  <text x="160" y="372" text-anchor="middle" class="s-t">login-projNN</text>
  <text x="160" y="398" text-anchor="middle" class="s-b">az ml CLI · 승격 요청</text>
  <text x="160" y="420" text-anchor="middle" class="s-q">Entra 로그인</text>
  <!-- project RG -->
  <rect x="330" y="20" width="440" height="480" rx="12" class="s-grp" />
  <text x="346" y="44" class="s-g">과제 RG projNN · 개별 비용</text>
  <rect x="350" y="60" width="400" height="272" rx="10" class="s-acc" />
  <text x="550" y="86" text-anchor="middle" class="s-t">AML Workspace projNN (compute 없음)</text>
  <rect x="368" y="104" width="176" height="96" rx="8" class="s-box" />
  <text x="456" y="132" text-anchor="middle" class="s-t">Jobs · Metrics</text>
  <text x="456" y="156" text-anchor="middle" class="s-b">MLflow Run · Metric</text>
  <text x="456" y="178" text-anchor="middle" class="s-q">lineage Tag</text>
  <rect x="556" y="104" width="176" height="96" rx="8" class="s-box" />
  <text x="644" y="132" text-anchor="middle" class="s-t">Model Registry</text>
  <text x="644" y="156" text-anchor="middle" class="s-b">버전 · Tag · stage</text>
  <text x="644" y="178" text-anchor="middle" class="s-q">path = Blob 경로</text>
  <rect x="368" y="216" width="176" height="96" rx="8" class="s-box" />
  <text x="456" y="244" text-anchor="middle" class="s-t">Data assets</text>
  <text x="456" y="268" text-anchor="middle" class="s-b">uri_folder 버전</text>
  <text x="456" y="290" text-anchor="middle" class="s-q">manifest 해시 Tag</text>
  <rect x="556" y="216" width="176" height="96" rx="8" class="s-box" />
  <text x="644" y="244" text-anchor="middle" class="s-t">Datastore</text>
  <text x="644" y="268" text-anchor="middle" class="s-b">identity 기반</text>
  <text x="644" y="290" text-anchor="middle" class="s-q">→ 과제 Blob</text>
  <rect x="350" y="370" width="400" height="110" rx="10" class="s-box" />
  <text x="550" y="400" text-anchor="middle" class="s-t">Storage Account (Blob)</text>
  <text x="550" y="426" text-anchor="middle" class="s-b">datasets/v3 · checkpoints · models</text>
  <text x="550" y="452" text-anchor="middle" class="s-q">실물은 여기에만, AML은 URI로 참조</text>
  <!-- right -->
  <rect x="800" y="64" width="180" height="104" rx="8" class="s-box" />
  <text x="890" y="92" text-anchor="middle" class="s-t">공통 Serving</text>
  <text x="890" y="118" text-anchor="middle" class="s-b">production 버전</text>
  <text x="890" y="140" text-anchor="middle" class="s-q">Blob에서 pull</text>
  <rect x="800" y="204" width="180" height="104" rx="8" class="s-box" />
  <text x="890" y="232" text-anchor="middle" class="s-t">AML Studio UI</text>
  <text x="890" y="258" text-anchor="middle" class="s-b">Entra 그룹 g-projNN</text>
  <text x="890" y="280" text-anchor="middle" class="s-q">과제 구성원만 조회</text>
  <rect x="800" y="344" width="180" height="136" rx="8" class="s-grp" />
  <text x="890" y="372" text-anchor="middle" class="s-t">AML Registry</text>
  <text x="890" y="396" text-anchor="middle" class="s-q">(선택 · 공통 RG)</text>
  <text x="890" y="422" text-anchor="middle" class="s-b">과제 간 공유 모델만</text>
  <text x="890" y="444" text-anchor="middle" class="s-q">승인 후 승격 복사</text>
  <!-- connectors -->
  <path d="M280 136H368" class="s-ln" marker-end="url(#a2)" />
  <text x="324" y="128" text-anchor="middle" class="s-q">Metric</text>
  <path d="M280 262H368" class="s-ln2" marker-end="url(#a2b)" />
  <text x="324" y="254" text-anchor="middle" class="s-q">등록</text>
  <path d="M280 300H316V425H350" class="s-ln2" marker-end="url(#a2b)" />
  <path d="M644 312V370" class="s-ln" marker-end="url(#a2)" />
  <text x="652" y="346" class="s-q">참조</text>
  <path d="M732 128H800" class="s-ln" marker-end="url(#a2)" />
  <path d="M800 256H750" class="s-ln" marker-end="url(#a2)" />
  <path d="M732 180H780V412H800" class="s-ln" marker-end="url(#a2)" stroke-dasharray="4 4" />
</svg>
