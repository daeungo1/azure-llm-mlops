    <text x="372" y="436" class="small">rg-kt-mlops-team-2</text>
    <text x="372" y="470" class="small">mlw-ktmlops-secure-2</text>
    <text x="372" y="508">Storage · Key Vault</text>
    <text x="372" y="540">ACR · Insights · Logs</text>
    <text x="372" y="572" class="small">NSP · VNet · NAT · Private Link</text>
    <text x="372" y="604">학습 CPU min 0 / max 1</text>
    <text x="372" y="626" class="small">HF: kt-hf-cpu-team-2</text>
    <text x="372" y="646" class="small">compute identity → 자기 데이터</text>
    <text x="372" y="680" class="small">costCenter: kt-mlops-team-2</text>
  </g>
  <g class="node">
    <rect x="672" y="368" width="296" height="348" rx="12" fill="#f1f8f6" stroke="#087e76"/>
    <text x="692" y="402" class="heading">Team 3 / 전용 RG</text>
    <text x="692" y="436" class="small">rg-kt-mlops-team-3</text>
    <text x="692" y="470" class="small">mlw-ktmlops-secure-3</text>
    <text x="692" y="508">Storage · Key Vault</text>
    <text x="692" y="540">ACR · Insights · Logs</text>
    <text x="692" y="572" class="small">NSP · VNet · NAT · Private Link</text>
    <text x="692" y="604">학습 CPU min 0 / max 1</text>
    <text x="692" y="626" class="small">HF: kt-hf-cpu-team-3</text>
    <text x="692" y="646" class="small">compute identity → 자기 데이터</text>
    <text x="692" y="680" class="small">costCenter: kt-mlops-team-3</text>
  </g>
  <g class="node">
    <rect x="32" y="748" width="936" height="116" rx="12" class="box"/>
    <text x="52" y="782" class="heading">비용 확인: Cost Management → Cost analysis → Resource group별 분류</text>
    <text x="52" y="814">팀별 RG 비용과 공통 Registry backing RG 비용을 분리해서 확인</text>
    <text x="52" y="846" class="small">청구 반영 지연 가능 · 태그는 권한 경계가 아님 · max 1은 학습 VM 상한이며 서빙은 별도 과금</text>
  </g>
  <g class="node">
    <rect x="32" y="896" width="936" height="122" rx="12" fill="#f1f5fa" stroke="#b8c9da"/>
    <text x="52" y="930" class="heading">기존 검증 환경 유지: mlw-ktmlops-secure</text>
    <text x="52" y="962">Data v1/v2 · 학습 이력 · MLflow 모델 · HF CPU Endpoint</text>
    <text x="52" y="994" class="small">세 팀의 비용·자산 공유 테스트와 구분 · 완료 이력을 삭제하거나 Workspace 이름만 변경하지 않음</text>
  </g>
</svg>
