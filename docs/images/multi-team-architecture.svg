<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">팀별 RG와 공용 Azure ML Registry</title>
  <desc id="desc">세 팀은 각각 별도의 리소스 그룹, Workspace, Storage, Key Vault, ACR, 로그, VNet, NAT 및 private CPU Compute를 사용합니다. Registry Blob은 팀별 Private Endpoint로 연결하며 관리형 deny와 조직 정책을 유지합니다. 중앙 Azure ML Registry는 Data, Model, Environment 및 Component를 공유합니다. 각 팀의 HF CPU Online Endpoint는 공유 churn 모델 Job과 별도로 Entra 인증을 사용합니다. 팀 직접 비용은 RG별로 구분하며 Registry와 관리형 backing RG 비용은 공통 비용입니다. 기존 secure Workspace의 교육 이력과 HF Endpoint는 유지합니다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#32658b"/></marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px;fill:#17324d}
      .title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.small{font-size:16px;fill:#405b72}
      .box{fill:#fff;stroke:#8daec6;stroke-width:1.5}.edge{fill:none;stroke:#32658b;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="1050" rx="16" fill="#fff"/>
  <text x="32" y="46" class="title">팀별 격리와 공용 ML 자산 공유</text>
  <text x="32" y="78" class="small">Korea Central · 전용 리소스는 팀 RG 비용 · Registry와 backing 리소스는 공통 비용</text>
  <g class="node">
    <rect x="32" y="110" width="936" height="176" rx="14" fill="#edf3ff" stroke="#6888bd"/>
    <text x="52" y="146" class="heading">공통 RG: rg-kt-mlops / Azure ML Registry</text>
    <text x="52" y="178">mlr-ktmlops-shared</text>
    <text x="52" y="210">Model: telco-shared:1 · Environment: kt-shared-cpu:1</text>
    <text x="52" y="242">Component: verify_shared_model:3 · Data: telco-churn-shared:1/2</text>
    <text x="52" y="270" class="small">AML Registry는 ML 자산 카탈로그 · ACR은 컨테이너 이미지 저장소</text>
  </g>
  <path d="M500 286V318H180V368" class="edge"/>
  <path d="M500 286V368" class="edge"/>
  <path d="M500 286V318H820V368" class="edge"/>
  <text x="32" y="308" class="small">같은 Registry URI와 버전 참조 · 팀 간 Storage 권한 공유 아님</text>
  <g class="node">
    <rect x="32" y="368" width="296" height="348" rx="12" fill="#f1f8f6" stroke="#087e76"/>
    <text x="52" y="402" class="heading">Team 1 / 전용 RG</text>
    <text x="52" y="436" class="small">rg-kt-mlops-team-1</text>
    <text x="52" y="470" class="small">mlw-ktmlops-secure-1</text>
    <text x="52" y="508">Storage · Key Vault</text>
    <text x="52" y="540">ACR · Insights · Logs</text>
    <text x="52" y="572" class="small">NSP · VNet · NAT · Private Link</text>
    <text x="52" y="604">학습 CPU min 0 / max 1</text>
    <text x="52" y="626" class="small">HF: kt-hf-cpu-team-1</text>
    <text x="52" y="646" class="small">compute identity → 자기 데이터</text>
    <text x="52" y="680" class="small">costCenter: kt-mlops-team-1</text>
  </g>
  <g class="node">
    <rect x="352" y="368" width="296" height="348" rx="12" fill="#f1f8f6" stroke="#087e76"/>
