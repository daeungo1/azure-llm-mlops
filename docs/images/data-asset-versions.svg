<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
  <title id="title">Datastore 연결과 Data asset 버전의 차이</title>
  <desc id="desc">Datastore는 Storage 연결을 관리합니다. Data asset v1과 v2는 Storage의 서로 다른 경로를 참조합니다. v1은 1500행, v2는 1800행의 합성 데이터이며 등록이 원본을 불변화하지는 않습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="#32658b"/></marker>
    <style>text{font-family:"Segoe UI","Malgun Gothic",sans-serif;fill:#17324d;font-size:19px}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:17px;fill:#405b72}.edge{fill:none;stroke:#32658b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="450" rx="16" fill="#fff"/>
  <text x="36" y="46" class="title">Datastore는 연결, Data asset은 버전이 있는 참조</text>
  <g class="node"><rect x="36" y="150" width="262" height="166" rx="12" fill="#eef6ff" stroke="#83a9ca"/><text x="56" y="190" class="heading">Datastore</text><text x="56" y="231">Storage 위치 · 인증</text><text x="56" y="272" class="small">등록 정보 ≠ 읽기 권한</text></g>
  <g class="node"><rect x="386" y="126" width="278" height="214" rx="12" fill="#fff" stroke="#8daec6"/><text x="406" y="168" class="heading">Blob Storage</text><text x="406" y="211">v1 / telco.csv</text><text x="406" y="247">v2 / telco.csv</text><text x="406" y="302" class="small">파일의 실제 보관 위치</text></g>
  <g class="node"><rect x="752" y="94" width="292" height="123" rx="12" fill="#edf8f3" stroke="#89b9a2"/><text x="772" y="130" class="heading">Data v1</text><text x="772" y="164">1,500행 · seed 42</text><text x="772" y="195" class="small">클라우드 비교 실험의 입력</text></g>
  <g class="node"><rect x="752" y="249" width="292" height="123" rx="12" fill="#f4f2fb" stroke="#aea2ce"/><text x="772" y="285" class="heading">Data v2</text><text x="772" y="319">1,800행 · seed 43</text><text x="772" y="350" class="small">분포 변경 · 외부 학습 입력</text></g>
  <path class="edge" d="M298 233H386M752 155H708V211H664M752 311H708V247H664"/>
  <text x="309" y="218" class="small">연결</text>
  <text x="686" y="89" class="small">경로 참조</text>
  <text x="36" y="417" class="small">CSV와 MLTable 모두 v1/v2 등록 / 원본 파일 변경 정책과 미리보기 권한은 별도 관리</text>
</svg>
